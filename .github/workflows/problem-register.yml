name: 문제 등록

on:
  issues:
    # labeled는 넣지 않는다. 라벨이 붙은 채로 이슈가 만들어지면 GitHub이
    # opened와 labeled를 모두 발생시켜 같은 워크플로가 두 번 돈다.
    # 이슈 폼으로 만든 이슈는 opened만으로 잡히고, 뒤늦게 라벨을 붙여
    # 등록하려는 경우에는 본문을 한 번 수정하면 edited로 실행된다.
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: problem-register-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  register:
    # `problem` 라벨이 붙었거나, 이슈 폼으로 만들어진 이슈를 처리한다.
    # 라벨만으로 거르면 안 된다. 이슈 폼의 labels 설정은 레포에 이미 존재하는
    # 라벨만 붙이기 때문에, 라벨이 없는 새 레포에서는 첫 이슈가 무조건 걸러진다.
    # 본문의 필드 제목으로도 판별해서 이 부트스트랩 문제를 피한다.
    if: >-
      contains(join(github.event.issue.labels.*.name, ','), 'problem')
      || contains(github.event.issue.body, '### 문제 목록')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: 이슈 파싱 및 문제 폴더 생성
        id: register
        uses: actions/github-script@v7
        with:
          script: |
            const mod = await import(`file://${process.env.GITHUB_WORKSPACE}/.github/scripts/register-problem.mjs`);
            await mod.run({ github, context, core });

      - name: 문제 폴더 커밋 및 현황판 갱신
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
          TITLE: ${{ steps.register.outputs.title }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          node .github/scripts/build-leaderboard.mjs
          bash .github/scripts/commit-and-push.sh \
            "$BRANCH" \
            "chore: ${TITLE} 문제 폴더 생성 (#${ISSUE})" \
            solutions README.md

name: 문제 등록

on:
  issues:
    types: [opened, edited, labeled, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: problem-register-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  register:
    # `problem` 라벨이 붙은 이슈만 처리한다.
    if: contains(join(github.event.issue.labels.*.name, ','), 'problem')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: 이슈 파싱 및 문제 폴더 생성
        id: register
        uses: actions/github-script@v7
        with:
          script: |
            const mod = await import(`file://${process.env.GITHUB_WORKSPACE}/.github/scripts/register-problem.mjs`);
            await mod.run({ github, context, core });

      - name: 문제 폴더 커밋 및 현황판 갱신
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
          TITLE: ${{ steps.register.outputs.title }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          node .github/scripts/build-leaderboard.mjs
          bash .github/scripts/commit-and-push.sh \
            "$BRANCH" \
            "chore: ${TITLE} 문제 폴더 생성 (#${ISSUE})" \
            solutions README.md

name: 📌 알고리즘 문제 등록
description: 이번 주차에 함께 풀 문제를 등록합니다. 여러 개를 한 번에 등록할 수 있습니다.
title: '[문제] '
labels: [problem]
body:
  - type: markdown
    attributes:
      value: |
        문제 목록에 링크만 있으면 나머지는 워크플로가 처리합니다. (플랫폼은 링크로 자동 판별, 프로그래머스 번호는 링크에서 자동 추출)
        등록 후 잘못된 값이 있으면 **이슈 본문을 수정**하세요. 자동으로 다시 검사합니다.

  - type: input
    id: week
    attributes:
      label: 주차
      description: 숫자만 입력하세요. 예) 1 → week-01. 0은 온보딩/오리엔테이션 주차입니다. 이 이슈에 등록하는 모든 문제에 공통으로 적용됩니다.
      placeholder: '1'
    validations:
      required: true

  - type: textarea
    id: problems
    attributes:
      label: 문제 목록
      description: |
        프로그래머스는 링크만 한 줄씩 적어도 됩니다 (제목·번호를 자동으로 채웁니다).
        그 외에는 한 줄에 문제 하나씩, `|`(파이프)로 구분해서 입력하세요.
        형식: `링크 | 제목(선택) | 번호(선택) | 난이도(선택) | 마감일(선택)`
        - 링크: SWEA(swexpertacademy.com) 또는 프로그래머스(programmers.co.kr) 링크만 지원합니다.
        - 제목: 프로그래머스는 비워 두면 문제 페이지에서 자동으로 가져옵니다. SWEA는 직접 입력해야 합니다.
        - 번호: SWEA는 링크에 번호가 없어 직접 입력해야 합니다. 프로그래머스는 비워 두면 링크에서 자동 추출됩니다.
        - 난이도 / 마감일: 문제마다 다르면 각 줄에, 비워도 됩니다.
      placeholder: |
        https://school.programmers.co.kr/learn/courses/30/lessons/42627
        https://school.programmers.co.kr/learn/courses/30/lessons/12912 | | | Lv.1 | 2026-08-10
        https://swexpertacademy.com/main/code/problem/problemDetail.do?contestProbId=... | 백만 장자 프로젝트 | 1859 | D2 |
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 메모
      description: 힌트, 주의할 점, 관련 알고리즘 등 자유롭게 적어 주세요.
    validations:
      required: false
